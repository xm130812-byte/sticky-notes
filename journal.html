<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>便签日记 · Sticky Notes</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="journal.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 9l4-4 4 4"/><path d="M16 15l-4 4-4-4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M8 3v18"/><path d="M12 8h5M12 12h5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 8h10M7 12h7M7 16h4"/></svg>
      </span>
      <span class="brand-name">便签</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-sub">日记本</span>
    </div>

    <div class="top-actions">
      <label class="search" for="search">
        <svg class="icon search-icon"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="搜索记录" autocomplete="off" spellcheck="false" aria-label="搜索记录">
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </label>
      <button class="ghost-btn" id="btn-sort" type="button" title="切换日期排序">
        <svg class="icon"><use href="#i-sort"></use></svg>
        <span id="btn-sort-label">最新在前</span>
      </button>
      <button class="ghost-btn" id="btn-today" type="button" title="回到今天">
        <svg class="icon"><use href="#i-calendar"></use></svg>
        <span>今天</span>
      </button>
      <button class="primary-btn" id="btn-new" type="button" data-action="new" title="写一条" aria-label="写一条">
        <svg class="icon"><use href="#i-plus"></use></svg>
        <span>写一条</span>
      </button>
    </div>
  </header>

  <main class="page">
    <article class="sheet">
      <header class="sheet-head">
        <div>
          <div class="eyebrow">STICKY NOTES / JOURNAL</div>
          <h1>全部记录</h1>
        </div>
        <div class="sheet-meta" id="meta">共 0 条</div>
      </header>
      <div class="sheet-rule" aria-hidden="true"></div>
      <div class="journal-body" id="journal-body"></div>
      <footer class="sheet-foot">
        <span id="foot-count">共 0 条记录</span>
        <span>按创建日期排列 · 仅保存在本机</span>
      </footer>
    </article>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="journal.js"></script>
</body>
</html>
